<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Papelera Apack - Productos (Admin) </title>

    <!-- FontAwesome local -->
    <link rel="stylesheet" href="/public/assets/fontawesome/css/all.min.css">
    <!-- Swiffy Slider local -->
    <link rel="stylesheet" href="/public/assets/swiffy/swiffy-slider.min.css">
    <script src="/public/assets/swiffy/swiffy-slider.min.js" defer></script>

    <link rel="stylesheet" href="/public/ModificarProductos/Style.css" />

    <link rel="icon" type="image/jpeg" href="/public/Imagen/Logo_Apack.jpg">  
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidehead">
        <div class="Logo">
            <img src="/public/Imagen/Logo_Apack.jpg" alt="Logo" class="Logoinicial" />
          <input type="text" id="searchInput" class="search-input-header" placeholder="🔍   Buscar por código o nombre…"/>
          <div class="acciones">
            <button onclick="window.location.href='/public/MenuPrincipal/index.html'" class="btn">Menu Principal</button>
            <button onclick="window.location.href='/public/RegistroNuevoProductos/index.html'" class="btn">Agregar Productos</button>
            <button id="btnCerrarSesion" class="btn logout">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>
  </div>
    
  <div class="galeria" id="galeria"></div>

  <!-- Modal de edición -->
  <div class="modal" id="modalEditar">
  <span class="cerrar" id="cerrarModalEditar">&times;</span>
  <div class="modal-contenido" id="contenidoModalEditar">
    <h3>Editar Producto</h3>
    <div class="modal-body-editar">
      <!-- Izquierda: Inputs -->
      <form id="formEditarProducto" class="form-edicion">

        <label class="Datos">Código de Producto</label>
        <input type="text" id="editCodigo" placeholder="Código" disabled />

        <label class="Datos">Nombre de Producto</label>
        <input type="text" id="editNombre" placeholder="Nombre" />

        <label class="Datos">Precio Minorista</label>
        <input type="number" id="edit_precio_min" placeholder="Precio" />

        <label class="Datos">Cantidad Mayorista</label>
        <input type="number" id="edit_cantidad_may" placeholder="Precio" />

        <label class="Datos">Precio Mayorista</label>
        <input type="number" id="edit_precio_may" placeholder="Precio" />

        <label class="Datos">Cantidad de Stock</label>
        <input type="number" id="edit_cantidad_prod" placeholder="Precio" />

        <label>Imagen</label>
        <input type="file" id="editImagen" accept="image/*" />
        <button id="btnConfirmarEdicion" class="btn-ir-modificar">Confirmar</button>
      </form>

      <!-- Derecha: Vista previa -->
      <div id="previewEditar" class="preview-editar">
        <img id="imagenPreviaEditar" src="#" alt="Vista previa" style="display: none;"/>
      </div>
    </div>
  </div>
</div>
  

    <!-- Funciones Modificar/Eliminar -->
    <script src="/public/ModificarProductos/script.js" defer></script>
    <!-- Cierre de Session -->
    <script src="/public/Seguridad/sesion.js"></script>
    <!-- Seguridad de pagina -->
    <script type="module" src="/public/Seguridad/authProteccion.js"></script>


    <!-- Modal para ampliar imagen -->
<div id="visorImagen" class="modal-imagen">
  <span class="cerrar">&times;</span>
  <img class="imagen-ampliada" id="imagenAmpliada" />
</div>

</body>
</html>
