<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Papelera Apack - Registro de Productos (Admin)</title>
  <!-- FontAwesome local -->
  <link rel="stylesheet" href="/public/assets/fontawesome/css/all.min.css">
  <!-- Swiffy Slider local -->
  <link rel="stylesheet" href="/public/assets/swiffy/swiffy-slider.min.css">
  <script src="/public/assets/swiffy/swiffy-slider.min.js" defer></script>

  <link rel="stylesheet" href="/public/MenuPrincipal/Style.css" />
  <link rel="icon" type="image/jpeg" href="/public/Imagen/Logo_Apack.jpg">
</head>
<body>

  <header class="header">
    <div class="header-content">
        <img src="/public/Imagen/Logo_Apack.jpg" alt="Logo" class="logo" >
        <div class="acciones">
          <button id="btnCerrarSesion" class="btn logout">Cerrar sesión</button>
        </div>
    </div>
  </header>

  <div class="registro-container">
    <h1>Menú Principal</h1>
    <div class="registro-form">
  
      <div class="card" onclick="window.location.href='/public/RegistroNuevoProductos/index.html'">
        <img src="/public/Imagen/agregar_productos.jpg" alt="Agregar Productos">
        <div class="card-title">Agregar Productos</div>
      </div>
  
      <div class="card" onclick="window.location.href='/public/ModificarProductos/index.html'">
        <img src="/public/Imagen/ver_productos.jpg" alt="Ver Productos">
        <div class="card-title">Editar Productos</div>
      </div>
  
      <div class="card" onclick="window.location.href='/public/Transacciones/index.html'">
        <img src="/public/Imagen/transacciones.jpg" alt="Transacciones">
        <div class="card-title">Transacciones</div>
      </div>
  
    </div>
  </div>

  <!-- Cierre de Session -->
  <script src="/public/Seguridad/sesion.js"></script>
  <!-- Seguridad de pagina -->
  <script type="module" src="/public/Seguridad/authProteccion.js"></script>
  
  
</body>
</html>
